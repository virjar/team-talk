# TeamTalk Desktop 打包配置（Hydraulic Conveyor）
#
# 单机（macOS/Linux/Windows 均可）交叉产出三平台安装包与自更新站点。
# 产物形态：Windows MSIX+zip / macOS 签名 zip（Sparkle 自更新）/ Linux deb+tar.gz。
# 架构与授权结论见 doc/07-operations/desktop-cross-build.md。
#
# 依赖/入口/部署系统属性由 Gradle 插件提取（dev.hydraulic.conveyor），
# 不手工平面化依赖——Compose 1.10 的 jetbrains→androidx 双坐标桥接
# （桥接壳 + 真实现共存）必须按 gradle resolution 原样传递。
#
# 用法（项目根目录）：
#   conveyor -Kapp.machines=mac.amd64 make unnotarized-mac-zip   # 本机快速验证
#   conveyor make site                                            # 三平台 + 更新站点
#
# 私有化部署：修改 gradle/deployment.json 后重新构建（部署地址经
# nativeDistributions jvmArgs 提取固化）；更新站点目录放入自有静态文件服务。

include "#!../gradlew -q :desktop:printConveyorConfig"
# JVM/Compose 应用的 native 库（skiko dylib 等）提取配置——官方 jvm 模板必备，
# 缺失时 Skia native 加载异常表现为启动静默卡死。
# 本地化副本（构建不依赖远端 URL）：desktop/conveyor/extract-native-libraries.conf
include required("conveyor/extract-native-libraries.conf")
include required("/stdlib/jdk/17.0.14+136722/jetbrains.conf")

# 更新站点地址由 gradle/deployment.json 推导（printSiteConfig 任务）——
# 私有化构建只改 deployment.json，此处无任何手改项。
include "#!../gradlew -q :desktop:printSiteConfig"

app {
  fsname = teamtalk
  display-name = TeamTalk
  # TeamTalk 专有 logo（团队节点网络 T 字形，单一矢量源自动渲染三平台图标）
  icons = ../design/logo/svg/logo-main.svg
  windows.inputs += TASK/rendered-icons/windows
  linux.inputs += TASK/rendered-icons/linux
  rdns-name = com.virjar.tk
  # 开源免费授权条件：源码仓库地址（LICENSE 文件待项目确定后补充 license 键）
  vcs-url = github.com/virjar/team-talk

  # skiko 0.144 的 MachO 头要求 macOS >= 14（Sonoma，2023）
  mac.info-plist.LSMinimumSystemVersion = "14.0"

  # 无签名的本地验证包可直接安装；正式发布时补充 mac.notarize / windows 签名配置
}

# 与项目 JVM 目标（17）对齐
conveyor.compatibility-level = 17

conveyor.compatibility-level = 22
