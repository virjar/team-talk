android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# 展示版本在 Server / SDK / Android / Desktop 中一致；它不决定协议或数据库格式。
teamtalk.releaseVersion=0.0.7
# 平台安装序号独立递增，Android versionCode = releaseBuildNumber + 1。
teamtalk.releaseBuildNumber=7
# 二进制协议按发行批次演进：0.0.7 已冻结协议 0.6（MSG-01 消息轴心批次）。其后源码仅做
# 类型化重构（WireCoded 枚举视图，wire/DB 字段保持 Int，不构成 wire 变更），按发行校验
# 规则未新增契约时 minor 不得推进，因此协议保持在已发行 minor 0.6。
teamtalk.protocolMajor=0
teamtalk.protocolMinor=6
# 编译保留的最老 minor；服务器运行配置可以提高此下限，不能降低。
teamtalk.minimumProtocolMinor=0
