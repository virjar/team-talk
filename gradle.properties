android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# 展示版本在 Server / SDK / Android / Desktop 中一致；它不决定协议或数据库格式。
teamtalk.releaseVersion=0.0.2
# 平台安装序号独立递增，Android versionCode = releaseBuildNumber + 1。
teamtalk.releaseBuildNumber=2
# 二进制协议按发行批次演进：0.0.1 冻结协议 0.1，0.0.2 冻结协议 0.2；0.0.3 开发期 pending minor 3
# （T053 群头像 / T047 文档 @ 候选）。
teamtalk.protocolMajor=0
teamtalk.protocolMinor=3
# 编译保留的最老 minor；服务器运行配置可以提高此下限，不能降低。
teamtalk.minimumProtocolMinor=0
