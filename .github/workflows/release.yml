name: Build, Deploy & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  server:
    name: Server Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :server:installDist --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-server
          path: server/build/install/teamtalk-server/
          retention-days: 7

  # 单 job 交叉出三平台全套（mac 双架构 zip + Sparkle appcast、Windows MSIX +
  # appinstaller、Linux deb + tar.gz + apt 仓库 + 下载页），替代原三平台 matrix。
  # Conveyor 在 Linux 上可产出全部平台安装包（doc/07-operations/desktop-cross-build.md）。
  desktop-site:
    name: Desktop Site (Conveyor, all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Conveyor
        run: |
          curl -sL -o conveyor.deb https://downloads.hydraulic.dev/conveyor/hydraulic-conveyor_22.1_amd64.deb
          sudo apt install -y ./conveyor.deb
          conveyor --version
      - name: Build desktop jar
        run: ./gradlew :desktop:desktopJar --quiet
      - name: Build three-platform site
        env:
          CONVEYOR_AGREE_TO_LICENSE: "1"
        run: cd desktop && conveyor make site --overwrite
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-desktop-site
          path: desktop/output/
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :android:assembleRelease --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-android
          path: android/build/outputs/apk/release/*-release.apk
          retention-days: 7

  deploy:
    name: Deploy and Verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [server, desktop-site, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy server
        run: ./gradlew deployServer
      - name: Run business acceptance
        run: ./gradlew :server:acceptanceTest
      - name: Download desktop site artifact
        uses: actions/download-artifact@v4
        with:
          name: teamtalk-desktop-site
          path: desktop/output
      - name: Upload update site
        run: ./gradlew deployDesktopSite
      - name: Upload legacy-named clients (APK)
        uses: actions/download-artifact@v4
        with:
          path: client-artifacts
      - name: Upload APK
        run: ./gradlew uploadClientArtifacts -PARTIFACT_STAGING_DIR="$GITHUB_WORKSPACE/client-artifacts"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [server, desktop-site, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: TeamTalk ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/teamtalk-server/**
            artifacts/teamtalk-desktop-site/**
            artifacts/teamtalk-android/*.apk
