name: Release

on:
  push:
    branches: [main]
    paths: [gradle.properties]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: teamtalk-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the committed release
    runs-on: ubuntu-latest
    env:
      # CI 只负责 GitHub 归档发布；官网注册中心由维护者本机用同一密封包上传
      # （./gradlew release -PreleaseBundle=<密封目录> -PreleaseTargets=site）。
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAMTALK_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      TEAMTALK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TEAMTALK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            teamtalk-tools
      - name: Ensure Android tools for APK assembly and sealed bundle verification
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"'
      - name: Resolve release comparison and preserve tagged protocol history
        env:
          RELEASE_BASE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || '' }}
        run: |
          RELEASE_BASE="$(python3 scripts/ci/release_history.py "$RELEASE_BASE")"
          if [ -n "$RELEASE_BASE" ]; then
            echo "ORG_GRADLE_PROJECT_releaseBase=$RELEASE_BASE" >> "$GITHUB_ENV"
          fi
      # Android tools are prepared above. Gradle owns Node. 桌面交叉打包需要 NSIS（Windows 安装器）。
      - name: Install NSIS for the Windows setup.exe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Provide Android signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              if os.environ.get('ANDROID_KEYSTORE_BASE64'):
                  keystore = Path(os.environ['RUNNER_TEMP']) / 'teamtalk-android.jks'
                  keystore.parent.mkdir(parents=True, exist_ok=True)
                  keystore.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
                  keystore.chmod(0o600)
                  output.write(f'TEAMTALK_ANDROID_KEYSTORE={keystore}\n')
          PY
      - name: Reuse this run's sealed bundle after an interrupted publication
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: build/releases
      - name: Release through the same Gradle entry point as private workstations
        run: ./gradlew release -PreleaseTargets=github
      - name: Retain the exact bundle for inspection and publication retries
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: build/releases/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for key in ('TEAMTALK_ANDROID_KEYSTORE',):
              value = os.environ.get(key)
              if value:
                  Path(value).unlink(missing_ok=True)
          PY
