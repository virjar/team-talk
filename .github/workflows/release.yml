name: Release

on:
  push:
    branches: [main]
    paths: [gradle.properties]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: Client publication destinations (server deployment is always manual)
        type: choice
        default: github
        options: [github, 'site,github']

permissions:
  contents: write

concurrency:
  group: teamtalk-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the committed release
    runs-on: ubuntu-latest
    env:
      RELEASE_TARGETS: ${{ inputs.targets || vars.TEAMTALK_RELEASE_TARGETS || 'github' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAMTALK_RELEASE_SSH_PASSPHRASE: ${{ secrets.RELEASE_SSH_PASSPHRASE }}
      TEAMTALK_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      TEAMTALK_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TEAMTALK_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            teamtalk-tools
      # Hosted Ubuntu runners include the Android SDK. Gradle owns Node and Conveyor.
      - name: Provide existing signing identities and optional site credentials
        env:
          TEAMTALK_CONVEYOR_CONFIG_DIR: ${{ runner.temp }}/teamtalk-conveyor-signing
          TEAMTALK_RELEASE_SSH_KEY: ${{ runner.temp }}/teamtalk-release-ssh
          TEAMTALK_RELEASE_KNOWN_HOSTS: ${{ runner.temp }}/teamtalk-known-hosts
          CONVEYOR_DEFAULTS_CONF: ${{ secrets.CONVEYOR_DEFAULTS_CONF }}
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          def write_private(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(0o600)
          for secret, destination in (
              ('CONVEYOR_DEFAULTS_CONF', Path(os.environ['TEAMTALK_CONVEYOR_CONFIG_DIR']) / 'defaults.conf'),
              ('RELEASE_SSH_KEY', Path(os.environ['TEAMTALK_RELEASE_SSH_KEY'])),
              ('RELEASE_KNOWN_HOSTS', Path(os.environ['TEAMTALK_RELEASE_KNOWN_HOSTS'])),
          ):
              if os.environ.get(secret):
                  write_private(destination, os.environ[secret].replace('\r\n', '\n').encode())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key in ('TEAMTALK_CONVEYOR_CONFIG_DIR', 'TEAMTALK_RELEASE_SSH_KEY', 'TEAMTALK_RELEASE_KNOWN_HOSTS'):
                  output.write(f'{key}={os.environ[key]}\n')
              if os.environ.get('ANDROID_KEYSTORE_BASE64'):
                  keystore = Path(os.environ['RUNNER_TEMP']) / 'teamtalk-android.jks'
                  write_private(keystore, base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
                  output.write(f'TEAMTALK_ANDROID_KEYSTORE={keystore}\n')
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              if os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF_TYPE'] == 'branch':
                  before = event.get('before', '')
                  if before and before != '0' * 40:
                      output.write(f'ORG_GRADLE_PROJECT_releaseBase={before}\n')
          PY
      - name: Reuse this run's sealed bundle after an interrupted publication
        if: github.run_attempt != '1'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: build/releases
      - name: Release through the same Gradle entry point as private workstations
        run: ./gradlew release -PreleaseTargets="$RELEASE_TARGETS"
      - name: Retain the exact bundle for inspection and publication retries
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: build/releases/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'teamtalk-conveyor-signing', ignore_errors=True)
          for key in ('TEAMTALK_RELEASE_SSH_KEY', 'TEAMTALK_RELEASE_KNOWN_HOSTS', 'TEAMTALK_ANDROID_KEYSTORE'):
              value = os.environ.get(key)
              if value:
                  Path(value).unlink(missing_ok=True)
          PY
