name: Build, Deploy & Release Demo

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  server:
    name: Server Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :server:installDist --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-server
          path: server/build/install/teamtalk-server/
          retention-days: 7

  desktop-linux:
    name: Desktop (Linux deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageReleaseDistributionForCurrentOS --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-desktop-linux
          path: desktop/build/compose/binaries/main-release/deb/*.deb
          retention-days: 7

  desktop-windows:
    name: Desktop (Windows msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :desktop:packageReleaseDistributionForCurrentOS --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-desktop-windows
          path: desktop/build/compose/binaries/main-release/msi/*.msi
          retention-days: 7

  desktop-macos-arm64:
    name: Desktop (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageReleaseDistributionForCurrentOS --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-desktop-macos-arm64
          path: desktop/build/compose/binaries/main-release/dmg/*.dmg
          retention-days: 7

  desktop-macos-x86_64:
    name: Desktop (macOS Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: 'x64'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageReleaseDistributionForCurrentOS --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-desktop-macos-x86_64
          path: desktop/build/compose/binaries/main-release/dmg/*.dmg
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :android:assembleRelease --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: teamtalk-android
          path: android/build/outputs/apk/release/*-release.apk
          retention-days: 7

  deploy:
    name: Deploy and Verify Demo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [server, desktop-linux, desktop-windows, desktop-macos-arm64, desktop-macos-x86_64, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy Demo server
        run: ./gradlew deployServerDemo
      - name: Run Demo business acceptance
        run: ./gradlew :server:demoTest
      - uses: actions/download-artifact@v4
        with:
          path: client-artifacts
      - name: Upload Demo clients
        run: ./gradlew uploadClientArtifacts -PARTIFACT_STAGING_DIR="$GITHUB_WORKSPACE/client-artifacts"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [server, desktop-linux, desktop-windows, desktop-macos-arm64, desktop-macos-x86_64, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: TeamTalk ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/teamtalk-server/**
            artifacts/teamtalk-desktop-linux/*.deb
            artifacts/teamtalk-desktop-windows/*.msi
            artifacts/teamtalk-desktop-macos-arm64/*.dmg
            artifacts/teamtalk-desktop-macos-x86_64/*.dmg
            artifacts/teamtalk-android/*.apk
