name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.2
      # Hosted runners expose ANDROID_HOME; sdkmanager is not guaranteed on PATH.
      - name: Ensure Android tools for real APK identity tests
        if: runner.os != 'Windows'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"'
      - name: Ensure Android tools for real APK identity tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="$env:ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install cross-platform installer tools
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Exercise release metadata, protocol policy, archives and JVM publishers
        if: runner.os != 'Windows'
        run: ./gradlew -p buildSrc test --tests 'release.*'
      - name: Exercise release tooling through the native Windows wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat -p buildSrc test --tests 'release.*'
      - name: Exercise cross-platform shell and installer production
        if: runner.os != 'Windows'
        run: |
          ./gradlew :client:desktop:assembleDesktopShells
          dpkg-deb --info client/desktop/build/desktop-shell/linux-amd64/installer/*.deb
          dpkg-deb --contents client/desktop/build/desktop-shell/linux-amd64/installer/*.deb
      - name: Verify actual release edits before merge
        if: runner.os != 'Windows'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
          RELEASE_BASE="$(python3 scripts/ci/release_history.py "$RELEASE_BASE")"
          if [ -n "$RELEASE_BASE" ] && [ "$RELEASE_BASE" != "0000000000000000000000000000000000000000" ]; then
            ./gradlew verifyReleaseChange -PreleaseBase="$RELEASE_BASE"
          else
            ./gradlew verifyReleaseMetadata
          fi

      - name: Preserve release tooling test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-tools-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            buildSrc/build/test-results/test/
            buildSrc/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile shared + server
        run: ./gradlew :client:shared:compileKotlinJvm :server:server:compileKotlin

      - name: Check architecture boundaries
        run: ./gradlew checkArchitecture

      - name: Compile desktop
        run: ./gradlew :client:app:compileKotlinDesktop :client:desktop:compileKotlinDesktop

      - name: Compile Android debug
        run: ./gradlew :client:android:compileDebugKotlin

  ios:
    name: iOS Native tests and simulator application
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
      # Also inherited by the Gradle invocation inside the Xcode build phase.
      ORG_GRADLE_PROJECT_enableIos: 'true'
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list devices available
      - name: Exercise real Native storage, HTTP ownership and wire contracts
        run: |
          ./gradlew :protocol:protocol:iosSimulatorArm64Test :client:shared:iosSimulatorArm64Test :client:app:iosSimulatorArm64Test :client:ios:iosSimulatorArm64Test :client:ios:generateXcodeConfiguration --stacktrace
      - name: Build Swift host and Compose framework without distribution signing
        run: |
          set -o pipefail
          xcodebuild -project client/ios/TeamTalk.xcodeproj -scheme TeamTalk \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath client/ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build 2>&1 | tee "$RUNNER_TEMP/teamtalk-ios-build.log"
      - name: Preserve iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/teamtalk-ios-build.log
            protocol/protocol/build/test-results/iosSimulatorArm64Test/
            client/shared/build/test-results/iosSimulatorArm64Test/
            client/app/build/test-results/iosSimulatorArm64Test/
            client/ios/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: ignore
          retention-days: 14

  windows-desktop:
    name: Windows Desktop storage and packaged launcher
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Exercise Windows identity, private storage and reopening
        shell: pwsh
        run: |
          .\gradlew.bat :client:desktop:desktopTest --tests '*WindowsDesktopStartupTest' --stacktrace 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/teamtalk-windows-desktop-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build once here; release-tools covers cross-host production on Linux.
      - name: Build the Windows desktop portable package
        shell: pwsh
        run: |
          .\gradlew.bat :client:desktop:packageWindowsPortableWindowsAmd64 --stacktrace 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/teamtalk-windows-desktop-package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run the packaged EXE and bundled JBR with an isolated non-GUI payload
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $archives = @(Get-ChildItem 'client/desktop/build/desktop-shell/windows-amd64/TeamTalk-*-portable.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows portable archive' }
          python scripts/ci/windows_shell_smoke.py $archives[0].FullName 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/teamtalk-windows-desktop-smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows Desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-desktop-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/teamtalk-windows-desktop-*.log
            client/desktop/build/test-results/desktopTest/
            client/desktop/build/reports/tests/desktopTest/
            client/desktop/build/desktop-shell/windows-amd64/TeamTalk-*-portable.zip
          if-no-files-found: ignore
          retention-days: 14

  admin:
    name: Admin Build and Browser Regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and build admin application
        run: ./gradlew :server:admin:check

      - name: Install browser and verify asynchronous page queries
        run: ./gradlew :server:admin:installBrowser :server:admin:browserTest

      - name: Preserve browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: admin-browser-diagnostics-${{ github.run_attempt }}
          path: server/admin/build/reports/browser-tests/
          if-no-files-found: ignore
          retention-days: 14

  test:
    # 包括真实 PostgreSQL/TCP/SQLite 集成，不只是内部单元测试。
    # 远程部署与真实 GUI 验收仍由各自入口执行。
    name: Integration and Contract Tests
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamtalk_test
          POSTGRES_USER: teamtalk_test
          POSTGRES_PASSWORD: teamtalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamtalk_test -d teamtalk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TK_TEST_PG_JDBC: jdbc:postgresql://localhost:5432/teamtalk_test
      TK_TEST_PG_USER: teamtalk_test
      TK_TEST_PG_PASSWORD: teamtalk_test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: true

      # JavaCV loads avdevice even for file decoding; its Linux JNI needs system libraries.
      - name: Install FFmpeg native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libpulse0 libva-drm2 libva2 libxcb1 libxcb-shm0

      # Compile remote-only suites here; running their load still requires an explicit test deployment.
      - name: Run server tests and compile remote capacity suites
        run: ./gradlew :server:server:compileCapacityTestKotlin :server:server:test

      - name: Preserve failed server test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-test-failure-${{ github.run_attempt }}
          path: |
            server/server/build/test-results/test/*.xml
            server/server/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run protocol, shared SDK and Headless tests
        run: ./gradlew :protocol:protocol:jvmTest :protocol:protocol-netty:jvmTest :client:shared:jvmTest :client:shared-testkit:compileKotlinJvm :client:headless:test

      - name: Run shared UI and rich editor tests
        run: ./gradlew :client:richeditor:desktopTest :client:app:desktopTest

      - name: Run platform shell tests
        run: ./gradlew :client:desktop-bootstrap:test :client:desktop:desktopTest :client:android:testDebugUnitTest
