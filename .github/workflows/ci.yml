name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile shared + server
        run: ./gradlew :client:shared:compileKotlinJvm :server:server:compileKotlin

      - name: Check architecture boundaries
        run: ./gradlew checkArchitecture

      - name: Compile desktop
        run: ./gradlew :client:app:compileKotlinDesktop :client:desktop:compileKotlinDesktop

      - name: Compile Android debug
        run: ./gradlew :client:android:compileDebugKotlin

  admin:
    name: Admin Gradle Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and build admin application
        run: ./gradlew :server:admin:check

  test:
    # 包括真实 PostgreSQL/TCP/SQLite 集成，不只是内部单元测试。
    # 远程部署与真实 GUI 验收仍由各自入口执行。
    name: Integration and Contract Tests
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamtalk_test
          POSTGRES_USER: teamtalk_test
          POSTGRES_PASSWORD: teamtalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamtalk_test -d teamtalk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TK_TEST_PG_JDBC: jdbc:postgresql://localhost:5432/teamtalk_test
      TK_TEST_PG_USER: teamtalk_test
      TK_TEST_PG_PASSWORD: teamtalk_test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: true

      - name: Run server tests
        run: ./gradlew :server:server:test

      - name: Run protocol and shared SDK tests
        run: ./gradlew :protocol:protocol:jvmTest :protocol:protocol-netty:jvmTest :client:shared:jvmTest :client:shared-testkit:compileKotlinJvm

      - name: Run shared UI and rich editor tests
        run: ./gradlew :client:richeditor:desktopTest :client:app:desktopTest

      - name: Run platform shell tests
        run: ./gradlew :client:desktop:desktopTest :client:android:testDebugUnitTest
