name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile shared + server
        run: ./gradlew :shared:compileKotlinJvm :server:compileKotlin

      - name: Check architecture boundaries
        run: ./gradlew checkArchitecture

      - name: Compile desktop
        run: ./gradlew :app:compileKotlinDesktop :desktop:compileKotlinDesktop

      - name: Compile Android debug
        run: ./gradlew :android:compileDebugKotlin

  admin:
    name: Admin Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build admin application
        working-directory: admin
        run: npm ci && npm run build

  test:
    # 本地 CI 只做确定性的协议、算法、存储边界回归。
    # 跨客户端业务验收由 acceptance.yml 在真实部署上执行。
    name: Local Safety Tests
    runs-on: ubuntu-latest
    needs: compile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamtalk_test
          POSTGRES_USER: teamtalk_test
          POSTGRES_PASSWORD: teamtalk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamtalk_test -d teamtalk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TK_TEST_PG_JDBC: jdbc:postgresql://localhost:5432/teamtalk_test
      TK_TEST_PG_USER: teamtalk_test
      TK_TEST_PG_PASSWORD: teamtalk_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run server tests
        run: ./gradlew :server:test

      - name: Run protocol and shared SDK tests
        run: ./gradlew :protocol:jvmTest :shared:jvmTest

      - name: Run shared UI and rich editor tests
        run: ./gradlew :richeditor:desktopTest :app:desktopTest

      - name: Run platform shell tests
        run: ./gradlew :desktop:desktopTest :android:testDebugUnitTest
