name: Demo Business Acceptance

# TeamTalk 只有一个共享 Demo 环境。该流程不接受临时主机参数，
# 以免 CI 验证的目标与客户端真实连接的目标不一致。
on:
  workflow_dispatch:

jobs:
  demo-e2e:
    name: Demo E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run business tests against Demo
        run: ./gradlew :server:demoTest
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-business-test-report
          path: server/build/reports/tests/demoTest/
          retention-days: 7
