name: Deployment Business Acceptance

# 验收目标与客户端构建统一读取 gradle/deployment.json。
# fork 项目修改该文件即可让 CI 对接自己的私有化部署。
on:
  workflow_dispatch:

jobs:
  business-e2e:
    name: Remote Business E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/admin/package-lock.json
      - uses: gradle/actions/setup-gradle@v5.0.2
      - name: Run business tests against deployment
        run: ./gradlew :server:server:acceptanceTest
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-business-test-report
          path: server/server/build/reports/tests/acceptanceTest/
          retention-days: 7
