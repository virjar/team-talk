[versions]
node-gradle = "7.1.0"
nodejs = "24.20.0"
kotlin = "2.3.21"
compose = "1.11.1"
compose-material3 = "1.9.0"
compose-icons = "1.7.3"
agp = "8.13.2"
ktor = "3.5.2"
exposed = "0.61.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
sqldelight = "2.3.2"
ksp = "2.3.11"
rocksdb = "9.10.0"
logback = "1.6.3"
lucene = "9.12.3"
# Direct Netty usage must stay on Ktor's Netty line so compile-time APIs match the runtime graph.
netty = "4.2.17.Final"
slf4j = "2.0.19"
postgresql = "42.7.13"
hikaricp = "7.1.0"
jbcrypt = "0.4"
koin = "4.2.2"
ik-analyzer = "9.0.0"
composenativetray = "1.1.0"
turbine = "1.2.1"
jna = "5.15.0"
activity-compose = "1.13.0"
compose-media-player = "0.9.0"
jetbrains-markdown = "0.7.3"
ksoup = "0.6.0"
javacv = "1.5.12"
ffmpeg-natives = "6.1.1-1.5.12"
navigation-compose = "2.9.8"
uiautomator = "2.3.0"
buildconfig = "6.0.10"
media3 = "1.11.0"
coil = "3.4.0"

[libraries]
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
jetbrains-compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
jetbrains-compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons" }
jetbrains-compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Ktor Server
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty-host = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors-jvm", version.ref = "ktor" }

# Ktor Client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

# Exposed
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
rocksdb = { module = "org.rocksdb:rocksdbjni", version.ref = "rocksdb" }

# Auth
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

# Lucene
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }
lucene-highlighter = { module = "org.apache.lucene:lucene-highlighter", version.ref = "lucene" }
ik-analyzer = { module = "cn.shenyanchao.ik-analyzer:ik-analyzer", version.ref = "ik-analyzer" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# SQLDelight
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }

# Desktop UI
composenativetray = { module = "io.github.kdroidfilter:composenativetray", version.ref = "composenativetray" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
compose-media-player = { module = "io.github.kdroidfilter:composemediaplayer", version.ref = "compose-media-player" }
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrains-markdown" }
ksoup-html = { module = "com.mohamedrejeb.ksoup:ksoup-html", version.ref = "ksoup" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
ksoup-entities = { module = "com.mohamedrejeb.ksoup:ksoup-entities", version.ref = "ksoup" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

[bundles]
ktor-server = ["ktor-server-core", "ktor-server-netty-host", "ktor-server-content-negotiation", "ktor-serialization-kotlinx-json", "ktor-server-call-logging", "ktor-server-status-pages", "ktor-server-cors"]
ktor-client = ["ktor-client-core", "ktor-client-content-negotiation"]
netty = ["netty-handler", "netty-transport", "netty-buffer"]
exposed = ["exposed-core", "exposed-jdbc"]
lucene = ["lucene-core", "lucene-analysis-common", "lucene-queryparser", "lucene-highlighter"]

[plugins]
node = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
